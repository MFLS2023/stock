version: 1
project_name: 多来源交易知识库
source_libraries_root: _知识库系统/source_libraries
indexes_root: _知识库系统/indexes
default_adapter: generic_mixed
generic_supported_extensions: [.md, .txt, .pdf, .docx, .jpg, .jpeg, .png]

# 每个来源的可选字段（不写就自动推断，见 AGENTS.md）：
#   smoke_query:        单来源可查性验收用的检索词，至少三个字符；不写则从该来源正文自动取
#   author_smoke_query: --author 过滤验收用的检索词，至少三个字符；必须落在该作者自己写的块里，
#                       不与 smoke_query 互相兜底；不写则从该作者的块里自动取
#   author:             声明该来源有作者署名，值须是 chunks 里真实出现过的名字；
#                       不写则读 chunks 的 author 列，两边都没有就不测这项
sources:
  - id: fulibei
    display_name: 复利杯
    source_path: 复利杯
    source_type: transcript_pdf
    status: integrated_first_pass
    original_policy: read_only
    primary_locator: page_timestamp
    pipeline: transcript_with_speakers
    adapter: specialized_fulibei
    notes: 多人直播或连麦文字稿，保留嘉宾、说话人、页码和时间戳。

  - id: nanjinglu_bian
    display_name: 南京路彼岸
    source_path: 南京路彼岸
    source_type: dated_article_pdf
    status: integrated
    original_policy: read_only
    primary_locator: page_section
    pipeline: dated_article_chronology
    adapter: specialized_nanjinglu
    notes: 单作者连续文章，重点保留日期、章节、概念定义和观点演化。

  - id: tulip_garden
    display_name: 郁金香花园
    source_path: 郁金香花园付费文章文档版
    source_type: word_image_course
    status: integrated
    original_policy: read_only
    primary_locator: section_image
    pipeline: word_plus_ordered_ocr
    adapter: specialized_tulip
    notes: Word 正文与大量截图并存，必须恢复图片顺序和图文关系，视觉内容需回看原图。

  # id 用作者身份而非资料载体：飞书只是这批资料的导出格式，换个载体来源还是同一个人。
  # source_type / adapter 仍带 feishu，那两个描述结构和解析能力，可被其他飞书导出复用。
  - id: panfeng
    display_name: 我有上将潘凤
    source_path: 飞书聊天记录_潘凤
    source_type: feishu_chat_html
    status: integrated
    approved_on: '2026-08-02'
    original_policy: read_only
    primary_locator: date_time_message_number
    pipeline: speaker_time_aware_html
    adapter: specialized_feishu_chat
    author: 我有上将潘凤
    format_counts:
      .html: 1
    review_required: false
    complexity_signals:
      - 连续消息继承发言人，日期需由绝对日期锚点和组内时间回绕重建
    notes: 飞书HTML连续消息导出；保留发言人、重建交易日日期、继承unknown时间，并按消息编号引用。

  # 微信公众号导出。通用导入器的 clean_text 对这批 .md 只压缩 1.1%，图片语法和
  # URL 会整片留在正文里（实测抽样 300 篇残留 37642 处），所以走专用适配器。
  # 留言区平均占全文 73%：读者留言丢弃，作者本人回复提成 qa_reply 块。
  - id: aizaibingchuan
    display_name: 爱在冰川
    source_path: 爱在冰川
    source_type: wechat_official_markdown
    status: integrated
    approved_on: '2026-08-04'
    original_policy: read_only
    primary_locator: paragraph_section
    pipeline: wechat_markdown_with_comment_replies
    adapter: specialized_aizaibingchuan
    author: 爱在冰川
    # 2026-08-04 增量：用户补下载 2023 三季度缺失的 .md，按同一套规则筛出 71 篇入库，
    # 2584 -> 2655。另有 9 篇第三方 PDF/docx 汇编在 爱在冰川\额外资料\，
    # 由 import_azbc_extras.py 单独导入，不计入这里的 .md 计数。
    format_counts:
      .md: 2655
    review_required: false
    complexity_signals:
      - 微信样板与图片链接占原文约 77%，需专用清洗
      - 留言区占全文约 73%，须区分读者留言与作者回复
    notes: 微信公众号导出 Markdown；已剔除资讯汇总与短线资金流，图片未 OCR，图表内容需回看原文。
