  点位区间:
    canonical: 目标位
    variants: [阻力, 支撑, 压力位, 理论点位, 目标点位]
    note: 目标位 30/1（近乎本源独有）、阻力 50/58、支撑 85/522。
      ⚠️ 「理论点位」仅 11 块但**是他的标志性说法**（「我们计算的理论点位是3883点」），
      回测抽取器漏掉这个句式导致样本少了 3 条，所以必须收

  相对强度:
    canonical: 强度
    variants: [强度线, 相对强度, 强弱]
    note: 强度 43/270。他的核心自拟指标叫「强度指标」（C/INDEXC*10000 的多均线），
      语料里出现 4 次公式源码。⚠️ 「相对强度」四字全库仅个别命中，靠 variants 对齐

# 实测为零命中、不要加进 groups 的词（留档避免重复踩）
dead_terms:
  - 市场最悲观
  - 先弱后强
  - 模式验证    # 用户问法，全库 0 命中
  # 「由弱转强」1 块，但那 1 块是**读者提问**用词（aizaibingchuan qa_reply），
  # 作者本人从未用过，所以留在死词区。扩展它只会捞到读者的话。
  - 由弱转强
