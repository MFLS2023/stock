# 检索同义词表 —— query_kb.py --expand 读这个文件
#
# 为什么需要它：探库实测（scripts/probe_user_questions.py，2026-08-08）发现用户的
# 书面问法与作者的口语用词召回量级差极大：
#     情绪核心  2 条    vs  龙头 1825 / 大票 312
#     买卖计划  1 条    vs  推演 256 / 卖点 269 / 预案 78
#     模式验证  0 条
# 缺的不是内容，是「把用户问法对齐到作者用词」这一层。
#
# 三条硬规则（都是踩过坑写下来的）：
#
# 1. **只加词，不替换。** `弱转强` 在复利杯有 43 块，但 `转势` 在复利杯零命中。
#    拿同义词顶替原词会把该来源的内容整体丢掉。
#
# 2. **不收零命中的死条目。** 曾经把 `先弱后强`、`极度低迷` 写进表里，全库 0 命中，
#    扩展它们是空动作。但注意死条目会被新来源复活：`极度低迷`、`空间龙` 在爱在冰川
#    接入后分别有了 3 块和 5 块。所以每次接入新来源都要重测。
#
# 3. **单来源独有词要标出来。** `涨停动因`、`填权`、`北向资金` 只在爱在冰川出现，
#    拿它们检索等于只查一个来源，跨来源比较时会得出错误结论。
#
# 括号里的数字是 text 列子串命中块数（2026-08-08 实测，9175 块）。
# 重测命令：python scripts/check_synonyms.py

version: 3
measured_at: "2026-08-08"
measured_chunks: 9175

groups:
  情绪周期:
    canonical: 情绪周期
    variants: [冰点, 高潮, 分歧, 退潮, 情绪冰点]
    note: 郁金香明确反对把情绪周期当分析框架，跨来源比较时不要合并成一句结论

  弱转强:
    canonical: 弱转强
    variants: [转势, 强转弱, 走弱转强]
    note: 转势在复利杯零命中，不可反向替换；走弱转强为复利杯独有

  龙头:
    canonical: 龙头
    variants: [龙一, 龙二, 核心票, 先于龙, 人气核心, 总龙头]
    note: 先于龙主要在南京路（9 块中 7 块）

  情绪核心:
    canonical: 龙头
    variants: [人气核心, 核心票, 情绪核心]
    note: 用户问法「情绪核心」仅 2 块，作者实际说「龙头」（1825 块）

  容量核心:
    canonical: 大票
    variants: [权重, 容量标, 高位股, 容量核心]
    note: 用户问法「容量核心」仅 8 块；郁金香的「容量标」指个股换手承接力，与市场资金容量不同义

  主力:
    canonical: 主力
    variants: [机构, 散户, 游资, 大资金, 外资, 庄家, 北向资金]
    note: 北向资金为爱在冰川独有（267 块）

  入场:
    canonical: 入场
    variants: [打板, 低吸, 潜伏, 开仓, 追高, 半路, 埋伏, 进场, 起步]

  竞价:
    canonical: 竞价
    variants: [高开, 低开, 集合竞价, 竟价, 竞价抢筹]
    note: 竟价是错别字但有 129 块，其中 128 在郁金香——查郁金香竞价内容必须带这个词

  连板:
    canonical: 连板
    variants: [反包, 首板, 二板, 三板, 烂板, 断板, 板高, 连板高度]

  涨停归因:
    canonical: 动因
    variants: [涨停动因, 涨停原因]
    note: 涨停动因 1354 块为爱在冰川独有，且对应正文小节 99.7% 为空（内容在图里）

  卖出与下跌:
    canonical: 止损
    variants: [割肉, 杀跌, 利空, 跳水, 砸盘, 补跌]

  仓位:
    canonical: 仓位
    variants: [空仓, 加仓, 满仓, 清仓, 减仓, 半仓, 底仓]
    note: 92科比主张小资金分仓、涅盘重升主张满仓单票，两人相隔两天给出相反建议

  量价:
    canonical: 缩量
    variants: [放量, 均线, 影线, 上影线, 十字星, 长上影]
    note: 长上影为爱在冰川独有

  高送转:
    canonical: 高送转
    variants: [送转, 填权, 业绩报, 除权, 预增]
    note: 填权与业绩报为爱在冰川独有；这批词会捞到 course_ocr（confidence=low），数字不可信

  自选池:
    canonical: 票池
    variants: [自选股, 股池, 观察池]
    note: 股池为爱在冰川独有，观察池为郁金香独有

  监管异动:
    canonical: 异动
    variants: [监管, 特停, 卡异动, 被关小黑屋]
    note: 特停 124 块中 122 在爱在冰川

  # 以下几组来自方法卡的 user_questions 探库结果，补的是「用户问法 -> 作者用词」
  买卖计划:
    canonical: 推演
    variants: [卖点, 预案, 计划, 买卖计划]
    note: 用户问法「买卖计划」仅 1 块，作者说「推演」256 / 「卖点」269 / 「预案」78

  拐点:
    canonical: 拐点
    variants: [反包, 冰点, 变盘, 转折]

  增量资金:
    canonical: 增量
    variants: [承接, 放量, 场外资金]

  题材级别:
    canonical: 题材
    variants: [主线, 大题材, 话题]
    note: 用户问法「大小题材」「题材级别」各仅 1 块

  交易系统:
    canonical: 体系
    variants: [模式, 纪律, 交易系统]
    note: 用户问法「主干」仅 1 块

  资金体量:
    canonical: 资金体量
    variants: [流动性, 半路, 大资金, 小资金]
    note: 用户问法「滑点」仅 1 块

# 实测为零命中、不要加进 groups 的词（留档避免重复踩）
dead_terms:
  - 市场最悲观
  - 由弱转强
  - 先弱后强
  - 入场时机
  - 模式验证    # 用户问法，全库 0 命中
