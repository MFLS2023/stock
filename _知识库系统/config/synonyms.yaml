  主力:
    canonical: 主力
    variants: [机构, 散户, 游资, 大资金, 外资, 庄家, 北向资金]
    note: 北向资金为爱在冰川独有（267 块）

  入场:
    canonical: 入场
    variants: [打板, 低吸, 潜伏, 开仓, 追高, 半路, 埋伏, 进场, 起步, 入场时机]
    note: 「入场时机」曾在 dead_terms（v3 时全库 0 命中），2026-08-09 复活为 2 块 ——
      其中 1 块是波段之门**作者本人**说的（「不过，要找好入场时机」），
      另 1 块是读者提问。因为有作者用例，移回 groups。
      ⚠️ 死词复活是常态：每次接入新来源都要重跑 check_synonyms.py

