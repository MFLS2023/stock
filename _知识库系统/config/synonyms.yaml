    variants: [涨停动因, 涨停原因]
    note: 涨停动因 1354 块为爱在冰川独有，且对应正文小节 99.7% 为空（内容在图里）

  卖出与下跌:
    canonical: 止损
    variants: [割肉, 杀跌, 利空, 跳水, 砸盘, 补跌]

  仓位:
    canonical: 仓位
    variants: [空仓, 加仓, 满仓, 清仓, 减仓, 半仓, 底仓]
    note: 92科比主张小资金分仓、涅盘重升主张满仓单票，两人相隔两天给出相反建议

  量价:
    canonical: 缩量
    variants: [放量, 均线, 影线, 上影线, 十字星, 长上影]
