  # ↓ 以下是第 6 个来源「波段之门」带来的新词汇域（2026-08-09 加）。
  # 它是波浪理论 + 通达信指标公式路线，与另五个来源的短线情绪体系几乎不重叠，
  # 所以这几组在别处命中极少甚至为零 —— 那不是死条目，是来源特有的方法论。
  波段:
    canonical: 波段
    variants: [大底, 中枢]
    note: 波段 1150 块在波段之门 / 其他五源仅 177；大底 159 vs 23。此源为主

  浪型:
    canonical: 浪型
    variants: [浪形, 一浪, 三浪, 五浪, 调整浪]
    note: 浪形 18 块为波段之门独有（其他五源 0）；浪型 29 vs 2。波浪理论专属词汇。
      ⚠️ 「推动浪」曾被我按波浪理论常识写进来，实测全库 0 命中已删 ——
      教训：波浪理论的标准术语不等于他实际用的词，每个都要先查

  背驰:
    canonical: 背驰
    variants: [背离]
    note: 背驰 13 块为波段之门独有（其他五源 0）。⚠️ 背离 56 vs 152 是通用词，
      两者在缠论/波浪语境下近义但不等价，跨来源比较时不要合并

  指标公式:
    canonical: 公式
    variants: [指标, 副图, 主图]
    note: 副图 6 块为波段之门独有；公式 122 vs 64、主图 15 vs 1。
      该来源有 19 块 chunk_type=indicator_formula，是全库唯一带可执行公式的类型。
      ⚠️ 「选股器」实测波段之门 0 命中（全库仅 4），未收

  # ↓ 以下 4 组是第 7 个来源「主升龙头空空龙」带来的新词汇域（2026-08-09 加）。
  # 它讲的是「早盘 15 分钟超预期首板怎么不被炸板爆头」这一件很窄很具体的事，
  # 与另六个来源的情绪周期/波浪理论路线不重叠。接入前这批词全库零命中。
  # 括号里两个数是「本来源 / 其他六源」实测块数（2026-08-09，18875 块）。

  防爆头:
    canonical: 防爆头
    variants: [爆头, 炸板, 秒板, 排板, 回封]
    note: 防爆头 25 块**为本来源独有**（其他六源 0）—— 这是他自创的说法，
      指「避免打板后被炸板套住」的整套核查流程。
      ⚠️ 爆头 33/70、秒板 23/317、排板 17/155、回封 24/475 是跨源共有词，
      拿它们检索不会只查到这个来源；但「防爆头」是唯一能精确定位这套体系的入口。

  超预期甄别:
    canonical: 超预期
    variants: [超预期首板, 伪超预期, 催化逻辑, 利好兑现]
    note: 超预期首板 10 块、伪超预期 16 块**均为本来源独有**。
      他把「超预期」拆成真伪两类并给了四条标尺（催化/竞价/地位/分时），
      这是全库唯一的系统拆解。
      ⚠️ 「真超预期」实测全库 0 命中（他写作「真·超预期」带间隔号），未收。

  封单虚实:
    canonical: 封单
    variants: [虚假封单, 虚假骗炮, 骗炮, 换手生死线, 筹码生死线, 套牢盘生死线, 潜伏盘, 套牢盘]
    note: 虚假封单 30 / 虚假骗炮 22 / 换手生死线 10 / 筹码生死线 8 /
      套牢盘生死线 6 —— 这 5 个**均为本来源独有**。
      「生死线」是他的量化阈值命名法（如「套牢盘占流通盘超 15% 直接放弃」）。
      ⚠️ 骗炮 35/62、套牢盘 23/136、潜伏盘 11/60 是跨源共有词。
      ⚠️ 「封成比」全库 0 命中（那是东财接口字段名，不是他的用词），未收。

  板块切换:
    canonical: 高低切
    variants: [横切, 外切, 围炉取暖, 抱团取暖, 千亿资金, 千亿板块, 反压位, 分歧转一致, 弱分歧]
    note: 横切 3 / 外切 2 / 围炉取暖 1 / 千亿资金 3 / 千亿板块 1 / 反压位 2 ——
      **均为本来源独有**，且都是个位数命中。低频但不可替代：
      「围炉取暖」指资金反复抱团同一细分板块，「横切」指在板块内部换股而非跨板块。
      ⚠️ 高低切 4/183、分歧转一致 4/52、弱分歧 4/4 是跨源共有词。
      ⚠️ 「20cm套利」全库 0 命中（他写作「20厘米套利」或「科创20cm」），未收。

  # ↓ 以下 7 组是 2026-08-09 补的「口语问法」层。加它们的原因不是同义词缺失，
  # 而是 split_sentence() 的切词表里没有这些词，导致整句检索直接零命中：
  #     「大盘走到哪一步了」→ 未找到（而「大盘」有 2258 块）
  #     「趋势反转」→ 未找到（而「趋势」有 2796 块）
  #     「个股趋势反转开始主升怎么高抛低吸」→ 只切出「低吸」，主升/高抛低吸全丢
  # 用户不懂编程，看到「未找到」只会以为库里没有 —— 这是可用性缺陷不是数据缺陷。
  # 括号里两个数是「波段之门 / 其他五源」实测块数（2026-08-09，17843 块）。
  大盘走势:
    canonical: 大盘
    variants: [指数, 上证, 股指, 大盘走势]
    note: 大盘 574/1684。用户高频问法「大盘走到哪一步了」原先零命中，是切词表没有「大盘」

  趋势阶段:
    canonical: 趋势
    variants: [主升, 反转, 趋势反转, 主升段, 主升浪]
    note: 趋势 174/2622、主升 52/278。「趋势反转」四字全库 0 命中，
      但拆成「趋势」+「反转」都有内容，所以收为 variants 而不进 dead_terms

  高低点:
    canonical: 高点
    variants: [低点, 顶部, 底部, 新高, 新低, 高抛低吸]
    note: 顶部 300/59、底部 426/249、新低 183/140、高抛低吸 72/34 —— 这五个波段之门为主。
      他的方法论核心就是找高低点，这批词在他这里的密度明显高于短线情绪派各源

  周期级别:
    canonical: 级别
    variants: [日线, 周线, 月线, 季线, 分时, 共振, 大级别, 小级别]
    note: 周线 271/27、月线 135/27 波段之门为主（他自述只做周线级别）；
      分时 138/787 则以其他源为主。⚠️ 「季线」仅 19 块，收在这里但别单独用它检索。
      ⚠️ 「级别共振」全库 0 命中已删（2026-08-09 实测）——「共振」308 块是真的，
      但两词连写没人用。改收 大级别 60 / 小级别 23，均实测有命中。
      这是第二次踩同一个坑（上次是「推动浪」）：**复合术语要整体查过再收**

  技术信号:
    canonical: 金叉
    variants: [死叉, 背离, 钝化, KD, KDJ, 缺口, 箱体]
    note: 金叉 68/41、死叉 78/40、KD 181/19、KDJ 47/11 —— 均为波段之门为主。
      ⚠️ 「钝化」仅 11 块（他讲 KD 钝化时多写作「D值在80上方」这类描述），
