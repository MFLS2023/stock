# 检索同义词表 —— query_kb.py --expand 读这个文件
#
# 为什么需要它：探库实测（scripts/probe_user_questions.py，2026-08-08）发现用户的
# 书面问法与作者的口语用词召回量级差极大：
#     情绪核心  2 条    vs  龙头 1825 / 大票 312
#     买卖计划  1 条    vs  推演 256 / 卖点 269 / 预案 78
#     模式验证  0 条
# 缺的不是内容，是「把用户问法对齐到作者用词」这一层。
#
# 三条硬规则（都是踩过坑写下来的）：
#
# 1. **只加词，不替换。** `弱转强` 在复利杯有 43 块，但 `转势` 在复利杯零命中。
#    拿同义词顶替原词会把该来源的内容整体丢掉。
#
# 2. **不收零命中的死条目。** 曾经把 `先弱后强`、`极度低迷` 写进表里，全库 0 命中，
#    扩展它们是空动作。但注意死条目会被新来源复活：`极度低迷`、`空间龙` 在爱在冰川
#    接入后分别有了 3 块和 5 块。所以每次接入新来源都要重测。
#
# 3. **单来源独有词要标出来。** `涨停动因`、`填权`、`北向资金` 只在爱在冰川出现，
#    拿它们检索等于只查一个来源，跨来源比较时会得出错误结论。
#
# 括号里的数字是 text 列子串命中块数（2026-08-08 实测，9175 块）。
# 重测命令：python scripts/check_synonyms.py

version: 5
measured_at: "2026-08-09"
measured_chunks: 18875
# v5 变化：新增第 7 个来源 kongkonglong（主升龙头空空龙）163 块，带来一整个
#   此前零命中的词汇域 —— 「防爆头」体系（早盘 15 分钟超预期首板的炸板规避方法论）。
#   接入前实测这 10 个词在 17869 块里**全部零命中**：
#     防爆头 / 超预期首板 / 伪超预期 / 虚假封单 / 换手生死线 / 筹码生死线 /
#     千亿资金 / 横切 / 外切 / 围炉取暖
#   同期 boduanzhimen 7169→7986、nanjinglu_bian 525→551（付费 PDF 的 OCR 补充），
#   故全库 17869 → 18875，v4 的命中数已过时。
#
# ⚠️ kongkonglong 只有 163 块（占全库 0.9%）但词汇域独特，**低频不等于无效**：
#   「围炉取暖」1 块、「外切」2 块、「反压位」2 块 —— 它们是该来源特有的说法，
#   不收进表就等于这套方法论在库里检索不到。
#
# v4 变化（留档）：全库 9175 → 17869，两个原因叠加 ——
#   ① 新增第 6 个来源 boduanzhimen（波段之门）7169 块，2012-2026 跨 14 年
#   ② aizaibingchuan 修 MIN_AUTHOR_REPLY 后从 5813 涨到 7338（找回被误丢的短回复）

